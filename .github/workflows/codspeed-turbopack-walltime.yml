name: CodSpeed Turbopack walltime (variance demo)

on:
  workflow_dispatch:
    inputs:
      runs:
        description: 'Number of identical benchmark jobs to launch'
        required: true
        default: '1'
  push:
    branches:
      - codspeed/turbopack-walltime-variance

permissions:
  contents: read

env:
  CI: 1
  RUST_LOG: 'off'

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.generate.outputs.ids }}
    steps:
      - name: Generate benchmark matrix
        id: generate
        env:
          REQUESTED_RUNS: ${{ inputs.runs || '1' }}
        run: |
          if ! [[ "$REQUESTED_RUNS" =~ ^[1-9][0-9]*$ ]] || (( REQUESTED_RUNS > 256 )); then
            echo "::error::runs must be an integer between 1 and 256"
            exit 1
          fi

          ids="$(seq -s, 1 "$REQUESTED_RUNS")"
          echo "ids=[$ids]" >> "$GITHUB_OUTPUT"

  bench:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJson(needs.matrix.outputs.ids) }}
    name: 'Gen 2 small_apps walltime #${{ matrix.id }}'
    runs-on: codspeed-macro-x86-ryzen-9950x-ubuntu-24-04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: codspeed-turbopack-walltime-v2
          key: ${{ runner.arch }}
          cache-on-failure: true

      - name: Install cargo-codspeed
        run: |
          if ! cargo binstall --locked --no-confirm cargo-codspeed@3.0.5; then
            cargo install cargo-codspeed --locked --version 3.0.5
          fi

      - name: Install benchmark apps
        working-directory: turbopack/benchmark-apps
        run: |
          npm i -g corepack@0.31
          corepack enable
          pnpm install --loglevel error

      - name: Build benches (walltime)
        env:
          CODSPEED_RUNNER_MODE: walltime
        run: cargo codspeed build -p turbopack-cli small_apps

      - name: Run benches
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: walltime
          run: cargo codspeed run -p turbopack-cli small_apps
